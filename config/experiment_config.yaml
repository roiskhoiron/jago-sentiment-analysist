# Experiment Matrix Configuration
# All experiments use identical train/test split for fair comparison

experiments:
  - id: experiment_a
    name: "TF-IDF + Logistic Regression"
    feature_extraction:
      method: "TF-IDF"
      ngram_range: [1, 2]
      max_features: 10000
    model:
      type: "LogisticRegression"
      class_weight: "balanced"
      max_iter: 1000
      solver: "liblinear"
      penalty: "l2"
      random_state: 42
    evaluation:
      metrics: ["accuracy", "precision_macro", "recall_macro", "f1_macro"]
      confusion_matrix: true
    target_accuracy: 0.85

  - id: experiment_b
    name: "TF-IDF + Linear SVM"
    feature_extraction:
      method: "TF-IDF"
      ngram_range: [1, 2]
      max_features: 10000
    model:
      type: "LinearSVC"
      class_weight: "balanced"
      max_iter: 2000
      C: 1.0
      random_state: 42
    evaluation:
      metrics: ["accuracy", "precision_macro", "recall_macro", "f1_macro"]
      confusion_matrix: true
    target_accuracy: 0.85

  - id: experiment_c
    name: "Fine-tuned IndoBERT"
    model:
      name: "indobenchmark/indobert-base-p1"
    fine_tuning:
      epochs: 3
      batch_size: 16
      learning_rate: 2e-5
      warmup_steps: 100
      weight_decay: 0.01
    evaluation:
      metrics: ["accuracy", "precision_macro", "recall_macro", "f1_macro", "perplexity"]
      confusion_matrix: true
    target_accuracy: 0.92

data_split:
  train_size: 0.8
  test_size: 0.2
  stratified: true
  random_state: 42

dataset:
  source: "Google Play Store (Bank Jago)"
  minimum_rows: 10000
  language: "id"
