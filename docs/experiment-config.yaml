experiments:
  - id: EXP-01
    model: LogisticRegression
    feature_extraction: tfidf_standard
    vectorizer:
      type: TF-IDF
      max_features: 10000
      ngram_range:
        - 1
        - 2
    split:
      train_ratio: 0.8
      test_ratio: 0.2
      stratify: true
      random_state: 42
    cv:
      folds: 5
    targets:
      accuracy_testing: 0.85
      f1_macro: 0.83
    notes: "Baseline model - simple, interpretable, fast inference"

  - id: EXP-02
    model: LinearSVC
    feature_extraction: tfidf_extended
    vectorizer:
      type: TF-IDF
      max_features: 15000
      ngram_range:
        - 1
        - 2
    split:
      train_ratio: 0.8
      test_ratio: 0.2
      stratify: true
      random_state: 42
    cv:
      folds: 5
    targets:
      accuracy_testing: 0.87
      f1_macro: 0.86
    notes: "Extended features for better precision"

  - id: EXP-03
    model: IndobertaForSequenceClassification
    feature_extraction: indobert_embeddings
    vectorizer:
      type: transformer
      pretrained_model: "indobenchmark/indobERT4-indonesian-1.5B"
      max_length: 128
      strategy: fine-tuning
    split:
      train_ratio: 0.8
      test_ratio: 0.2
      stratify: true
      random_state: 42
    cv:
      folds: 5
    targets:
      accuracy_testing: 0.90
      f1_macro: 0.89
    notes: "Deep learning approach - highest expected accuracy"

  - id: EXP-04
    model: LogisticRegression
    feature_extraction: bow_stopword
    vectorizer:
      type: CountVectorizer
      max_features: 8000
      stop_words: "indonesian_sastrawi"
    split:
      train_ratio: 0.75
      test_ratio: 0.25
      stratify: true
      random_state: 42
    cv:
      folds: 5
    targets:
      accuracy_testing: 0.84
      f1_macro: 0.82
    notes: "Simplified approach with stopword removal"

  - id: EXP-05
    model: LinearSVC
    feature_extraction: tfidf_stemmed
    vectorizer:
      type: TF-IDF
      max_features: 12000
      ngram_range:
        - 1
        - 3
    preprocessing:
      stemming: "sastrawi"
    split:
      train_ratio: 0.8
      test_ratio: 0.2
      stratify: true
      random_state: 42
    cv:
      folds: 5
    targets:
      accuracy_testing: 0.88
      f1_macro: 0.87
    notes: "Stemming improves feature normalization"

general:
  random_state: 42
  labels:
    negative: [1, 2]
    neutral: [3]
    positive: [4, 5]
  metrics_to_report:
    - accuracy
    - precision_per_class
    - recall_per_class
    - f1_macro
    - confusion_matrix
  overfitting_check:
    max_train_test_gap: 0.10
  artifact_storage:
    models: "models/"
    vectorizers: "models/vectorizers/"
    checkpoints: "models/checkpoints/"
